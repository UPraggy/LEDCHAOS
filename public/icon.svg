<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CHAOS">
  <title>CHAOS</title>
  <!--
    Marca do CHAOS: o "O" da palavra é um alvo (ver components/Logo).
    Cores travadas nos tokens do projeto (styles/tokens.css) porque SVG de
    ícone é servido fora do app e não enxerga var(--token):
      #0B0D14 = void-800 (--color-bg)   #07080E = void-900 (--color-bg-deep)
      #EAA94E = amber-400 (--color-action)   #9DB1EA = peri-400 (--color-info)
    Geometria dentro do círculo seguro de maskable (raio <= 40% de 512 = 204,8).
  -->
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="62%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#07080E" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#field)" />

  <!-- arcos soltos: o alvo não está estável -->
  <g fill="none" stroke="#9DB1EA" stroke-width="14" stroke-linecap="round" opacity="0.55">
    <path d="M 256 64 A 192 192 0 0 1 429.7 352" />
    <path d="M 256 448 A 192 192 0 0 1 96.7 363.2" />
  </g>

  <!-- anel do alvo -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#EAA94E" stroke-width="44" />

  <!-- centro -->
  <circle cx="256" cy="256" r="48" fill="#EAA94E" />
</svg>
