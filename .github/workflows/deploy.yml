# Publica o CHAOS no GitHub Pages pelo modelo "Deploy from a branch":
# o CODIGO-FONTE vive na `main`; o SITE BUILDADO e' empurrado para o branch
# `gh-pages` a cada push na main. O site roda em DOMINIO PROPRIO na raiz:
# https://ledchaos.rafaelmr.com.br/  (o CNAME vem de public/CNAME -> dist -> gh-pages).
#
# Config unica do Rafael (uma vez, no navegador dele):
#   1. Settings > Actions > General > Workflow permissions =
#      "Read and write permissions"
#      (sem isso o GITHUB_TOKEN nao consegue escrever no branch gh-pages -> 403)
#   2. Settings > Pages > Source = "Deploy from a branch"
#      Branch: gh-pages  /  Pasta: / (root)
#   3. Settings > Pages > Custom domain = ledchaos.rafaelmr.com.br > Save
#      (+ Enforce HTTPS quando liberar) e no provedor do rafaelmr.com.br um
#      registro DNS: CNAME  ledchaos -> upraggy.github.io
#
# Variaveis (Settings > Secrets and variables > Actions > Variables):
#   VITE_BASE   caminho base do site. Default "/" (dominio proprio na raiz).
#               So mudar para "/LEDCHAOS/" se um dia virar subpagina de projeto.
#   VITE_RELAY_URL  endereco wss:// do relay online (Render) para o multiplayer
#               real cruzar redes (4G <-> WiFi). SEM esta Variable o app roda em
#               modo local (sala simulada) e o build NAO quebra. Como o site e'
#               HTTPS, o relay TEM que ser wss:// (ws:// e' bloqueado por
#               mixed-content). Ex.: wss://ledchaos-relay.onrender.com
name: Deploy CHAOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Escrever no branch gh-pages exige contents: write.
permissions:
  contents: write

# Uma publicacao por vez; um push novo cancela a anterior em andamento.
concurrency:
  group: pages-ghbranch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (Vite)
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          # Injeta o relay online no bundle. Se a Variable nao existir, vira ''
          # e o app cai no modo local sem quebrar o build.
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
        run: npm run build

      - name: Publica dist/ no branch gh-pages
        # Repo git isolado dentro do dist/: um commit e force-push. O branch
        # gh-pages guarda SO o site (sem o historico do codigo) e e' substituido
        # inteiro a cada deploy. O `touch .nojekyll` desliga o Jekyll: sem isso o
        # Pages some com pastas iniciadas por "_" e pode reprocessar o site.
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git config user.name "Rafael Moreira Ramos"
          git config user.email "rafaelmoreira2001ofc@gmail.com"
          git add -A
          git commit -q -m "deploy: build de ${GITHUB_SHA::7}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
