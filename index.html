    <script>
      // spa-github-pages (técnica rafgraph, MIT) — restaura a rota que o
      // public/404.html empacotou na query, ANTES do app subir, para o
      // BrowserRouter enxergar o caminho original. Sem isto, abrir /join/7KX9Q
      // direto (o QR no celular faz exatamente isso) cairia no 404 do GitHub
      // Pages. Em domínio próprio na raiz não atrapalha nada quando a query
      // está vazia. Roda aqui no <head> porque o módulo do app é deferido.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (part) {
            return part.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
